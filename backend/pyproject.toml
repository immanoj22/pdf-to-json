[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-book-core"
version = "0.1.0"
description = "Lossless PDF evidence and a schema-independent universal book model"
requires-python = ">=3.12"
dependencies = [
  "pymupdf==1.28.2",
  "pydantic==2.13.5",
  "regex==2026.9.29",
  "shapely==2.2.0",
  "networkx==3.7",
  "numpy==2.5.3",
  "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
gpu = ["torch==2.14.1"]
models = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.19.0",
  "pillow==12.3.0",
  "safetensors==0.8.0",
]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
book-core = "book_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["full_book: optional read-only full-book benchmark"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
