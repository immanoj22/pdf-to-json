[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-book-core"
version = "0.1.0"
description = "Lossless PDF evidence and a schema-independent universal book model"
requires-python = ">=3.12"
dependencies = [
  "pymupdf==1.28.2",
  "rapidfuzz==3.14.6",
  "pydantic==2.13.5",
  "regex==2026.9.29",
  "shapely==2.2.0",
  "networkx==3.7",
  "numpy==2.5.3",
  "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
language-evidence = ["lingua-language-detector==2.2.0"]
math-conversion = ["latex2mathml==3.81.1"]
accuracy-models = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.19.0",
  "pillow==12.3.0",
  "safetensors==0.8.0",
  "timm==1.0.30",
  "docling-ibm-models==4.0.3",
]
gpu = ["torch==2.14.1"]
models = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.19.0",
  "pillow==12.3.0",
  "safetensors==0.8.0",
]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
language-comparison = ["langid==1.1.6"]
classical-ml = [
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "scipy==1.18.1",
  "joblib==1.6.0",
  "threadpoolctl==3.7.0",
  "narwhals==2.26.0",
  "cloudpickle==3.1.2",
]

[project.scripts]
book-core = "book_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["full_book: optional read-only full-book benchmark"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
