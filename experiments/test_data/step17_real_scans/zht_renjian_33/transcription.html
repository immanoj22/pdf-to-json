<div class="mw-content-ltr mw-parser-output" lang="zh-Hant" dir="ltr"><div class="prp-page-qualityheader quality3">本页已校对</div><div class="pagetext"><div class="mw-content-ltr mw-parser-output" lang="zh-Hant" dir="ltr"><p>如此。<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">北宋</span>以來，一人而已。
</p><p><br />
<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">陸放翁</span>跋<span style="text-decoration: underline;-moz-text-decoration-style: wavy;text-decoration-style: wavy;text-underline-offset:0.2em;">花閒集</span>謂「唐宋<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">五代</span>詩愈卑，
而倚聲輙簡古可愛。能此不能彼，未可以理推
也。」提要駁之，謂「猶能舉七十斤者，舉百斤則
蹶，舉五十斤則運掉自如。」其言甚辨。然謂詞
必易於詩，余未敢信。善乎<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">陳臥子</span>之言曰：「宋
人不知詩而强作詩，故終宋之世無詩。然其歡
愉愁苦之致動于中，而不能抑者，類發於詩餘，
故其所造獨工。<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">五代</span>詞之所以獨勝，亦以此也。
</p>
