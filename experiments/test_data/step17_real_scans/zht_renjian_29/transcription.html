<div class="mw-content-ltr mw-parser-output" lang="zh-Hant" dir="ltr"><div class="prp-page-qualityheader quality3">本页已校对</div><div class="pagetext"><div class="mw-content-ltr mw-parser-output" lang="zh-Hant" dir="ltr"><p>祖<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">南宋</span>而祧<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">北宋</span>，以<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">南宋</span>之詞可學，<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">北宋</span>不可
學也。學<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">南宋</span>者不祖<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">白石</span>，則祖<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">夢窗</span>，以<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;padding-inline-end: 2px;">白石</span><span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">夢
窗</span>可學，<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">幼安</span>不可學也。學<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">幼安</span>者率祖其粗獷
滑稽，以其粗獷滑稽處可學，佳處不可學也。<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">幼
安</span>之佳處在有性情，有境界；即以气象論，亦有
傍素波干青雲之槪。寧後世齷齪小生所可擬
耶？
</p><p><br />
<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">東坡</span>之詞曠，<span style="text-decoration: underline;-moz-text-decoration-style: solid;text-decoration-style: solid;text-underline-offset:0.25em;">稼軒</span>之詞豪。無二人之胸襟
而學其詞，猶東施之效捧心也。
</p>
