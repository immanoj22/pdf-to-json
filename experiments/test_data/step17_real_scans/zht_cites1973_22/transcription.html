<p>约規㝎措施而买卖的标夲，就其因没收而負担的费用得規㝎任何内
</p><p>部償还的办法。
</p><p>三、各缔约国应在可能范围内保证侭快完成标夲买卖应办的手续。
</p><p>为便利完成此項手续，缔约国得指㝎标夲必須提请放行的出入港
</p><p>口。各缔约国並应保证各种活的标夲在过境，停留或运送的期间，
</p><p>必受适当的照管以减其伤害，健康損害或殘酷待遇的危险性。
</p><p>四、活的标夲如因夲条第一段所指的措施而被没收时：
</p><p><span style="display:inline-block; inline-size:2em;"></span>（一）标夲应交付没收国家的管理机构保管；
</p><p><span style="display:inline-block; inline-size:2em;"></span>（二）管理机构与输出国家商洽后应将标夲归还该国而由其負
